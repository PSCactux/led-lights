[project]
name = "led-lights"
version = "0.1.0"
description = "Animations for WS2812 / NeoPixel LED strips and matrices, with a simulator so you can see them without hardware."
readme = "README.md"
license = "MIT"
authors = [{ name = "PSCactux" }]
requires-python = ">=3.12"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# Only installable on a Raspberry Pi (Linux). Imported lazily by the rpi backend.
rpi = ["rpi_ws281x>=5.0; sys_platform == 'linux'"]

[project.scripts]
led-lights = "led_lights.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
